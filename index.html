  const t={id,nr,label:'',maxPunkte:10,kategorie:'',taskType:'open',mcOptions:['','','',''],groupIds:[]};
  normalizeTask(t);
  c.tasks.push(t);
  materialSubTab='aufgaben';
  try{ localStorage.setItem('bwkMaterialSubTab', materialSubTab);}catch(e){}
  saveState(); renderAufgaben();
}
function addSubTask(parentId){
  const c=getActiveClass(); if(!c) return;
  const p=c.tasks.find(x=>x.id===parentId); if(!p) return;
  const id='t'+Date.now()+Math.random().toString(36).slice(2,5);
  const t={id,label:'',maxPunkte:5,kategorie:'',taskType:'open',mcOptions:['','','',''],groupIds:[],parentId:parentId};
  normalizeTask(t);
  const pos=insertAfterTaskBlock(c,parentId);
  c.tasks.splice(pos,0,t);
  saveState(); renderAufgaben();
}
function updateTaskPicto(tid, idRaw){ updateTask(tid, 'taskPicto', idRaw); }
function updateTask(id,field,val){
  const c=getActiveClass(); if(!c) return;
  const t=c.tasks.find(t=>t.id===id); if(!t) return;
  if(field==='maxPunkte'){
    t[field]=parseFloat(val)||0;
    if(t.taskType==='mc') syncMcScoresForTask(c,id);
  }else if(field==='taskType'){
    const wasMc=t.taskType==='mc';
    t.taskType=val; normalizeTask(t);
    if(wasMc&&val!=='mc'){
      c.students.forEach(s=>{ if(s.mcResponses) delete s.mcResponses[id]; });
    }
    if(!wasMc&&val==='mc'){
      c.students.forEach(s=>{
        if(s.answerTexts) delete s.answerTexts[id];
        if(s.openApprovals) delete s.openApprovals[id];
      });
    }
  }else if(field==='wsOffsetMm'){
    t.wsOffsetMm=Math.max(0,Math.min(36,Number(val)||0));
    normalizeTask(t);
  }else if(field==='wsOpenLines'){
    t.wsOpenLines=Math.max(1,Math.min(40,parseInt(val,10)||4));
    normalizeTask(t);
  }else if(field==='taskPicto'){
    const v=String(val==null?'':val);
    t.taskPicto=(v===''||TASK_PICTO_VALID.has(v))?v:'';
    normalizeTask(t);
  }else t[field]=val;
  saveState();
  if(field==='taskType'||field==='taskPicto') renderAufgaben();
}
function updateTaskMc(id,idx,val){
  const c=getActiveClass(); if(!c) return;
  const t=c.tasks.find(x=>x.id===id); if(!t) return;
  normalizeTask(t);
  while(idx>=t.mcOptions.length) t.mcOptions.push('');
  t.mcOptions[idx]=val;
  saveState(); renderAufgaben();
}
function addMcOption(id){
  const c=getActiveClass(); if(!c) return;
  const t=c.tasks.find(x=>x.id===id); if(!t) return;
  normalizeTask(t);
  if(t.taskType!=='mc') return;
  t.mcOptions.push('');
  saveState(); renderAufgaben();
}
function removeMcOption(id){
  const c=getActiveClass(); if(!c) return;
  const t=c.tasks.find(x=>x.id===id); if(!t) return;
  normalizeTask(t);
  if(t.taskType!=='mc'||t.mcOptions.length<=4) return;
  t.mcOptions.pop();
  const lim=t.mcOptions.length;
  if(Array.isArray(t.mcCorrectIndices)) t.mcCorrectIndices=t.mcCorrectIndices.filter(i=>i<lim);
  normalizeTask(t);
  syncMcScoresForTask(c,id);
  saveState(); renderAufgaben();
}
function toggleTaskGroup(tid,gid,on){
  const c=getActiveClass(); if(!c) return;
  const t=c.tasks.find(x=>x.id===tid); if(!t) return;
  if(t.parentId) return;
  if(!Array.isArray(t.groupIds)) t.groupIds=[];
  if(on){ if(!t.groupIds.includes(gid)) t.groupIds.push(gid); }
  else{ t.groupIds=t.groupIds.filter(x=>x!==gid); }
  saveState(); renderAufgaben();
}
function removeTask(id){
  const c=getActiveClass(); if(!c) return;
  const hasSubs=c.tasks.some(t=>t.parentId===id);
  if(!confirm((hasSubs?'Aufgabe inkl. Unteraufgaben ':'Aufgabe ')+'entfernen? Eingetragene Punkte gehen verloren.')) return;
  const rm=new Set([id,...collectDescendantTaskIds(c,id)]);
  c.tasks=c.tasks.filter(t=>!rm.has(t.id));
  c.students.forEach(s=>{
    if(s.scores) rm.forEach(tid=>{ delete s.scores[tid]; });
    if(s.mcResponses) rm.forEach(tid=>{ delete s.mcResponses[tid]; });
    if(s.answerTexts) rm.forEach(tid=>{ delete s.answerTexts[tid]; });
    if(s.openApprovals) rm.forEach(tid=>{ delete s.openApprovals[tid]; });
  });
  saveState(); renderAufgaben();
}

/** Pro Gruppenzeile: TN wählen und zuordnen bzw. Gruppe aufheben (Dialog). */
function openGroupAssignModal(gid){
  const c=getActiveClass(); if(!c) return;
  const g=c.groups.find(x=>x.id===gid); if(!g) return;
  if(!c.students.length){
    showModal('Keine Teilnehmer', '',()=>true,{okLabel:'OK',wide:true});
    return;
  }
  const gTitle=esc((g.name||'Gruppe').trim()+(g.text? ' – '+g.text:''));
  const rows=c.students.map(s=>{
    const g0=c.groups.find(x=>x.id===s.groupId);
    const inHere=s.groupId===gid;
    return`<tr>
      <td><input type="checkbox" class="ga-stu-chk" data-sid="${s.id}"${inHere?' checked':''}></td>
      <td><strong>${esc(s.nachname)}</strong>, ${esc(s.vorname)}</td>
      <td style="color:var(--text-muted);font-size:12.5px">${g0?esc(g0.name):'–'}</td>
    </tr>`;
  }).join('');
  const body=`
    <p style="font-size:12px;font-weight:600;margin:0 0 8px">Gruppe: <span style="color:var(--text)">${gTitle}</span></p>
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;align-items:center">
      <button type="button" class="btn btn-ghost btn-sm" id="ga-btn-all">Alle</button>
      <button type="button" class="btn btn-ghost btn-sm" id="ga-btn-none">Keine</button>
    </div>
    <div class="tbl-wrap" style="max-height:min(48vh,360px);overflow-y:auto;border:1px solid var(--border);border-radius:8px">
      <table>
        <thead><tr><th style="width:40px"></th><th>Name</th><th style="min-width:7rem">Aktuelle Gruppe</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  `;
  const root=document.createElement('div');
  root.className='modal-backdrop';
  root.innerHTML=`<div class="modal modal-wide modal-tn-assign" role="dialog" aria-modal="true" aria-labelledby="ga-modal-h" onclick="event.stopPropagation()">
    <div class="modal-header">
      <div class="modal-title" id="ga-modal-h">Teilnehmer zuweisen</div>
      <button type="button" class="modal-close" data-ga-close aria-label="Schlie&szlig;en">&#x2715;</button>
    </div>
    <div class="modal-body">${body}</div>
    <div class="modal-footer" style="flex-wrap:wrap;gap:8px;justify-content:flex-end">
      <button type="button" class="btn btn-ghost" data-ga-close>Abbrechen</button>
      <button type="button" class="btn btn-ghost" id="ga-btn-clear">Gruppe aufheben &hellip;</button>
      <button type="button" class="btn btn-primary" id="ga-btn-apply">Dieser Gruppe zuweisen</button>
    </div>
  </div>`;
  document.body.appendChild(root);
  const take=()=>[...root.querySelectorAll('.ga-stu-chk:checked')].map(ch=>ch.dataset.sid);
  const close=()=>{root.remove();};
  root.querySelector('#ga-btn-all').onclick=()=>{root.querySelectorAll('.ga-stu-chk').forEach(ch=>{ch.checked=true;});};
  root.querySelector('#ga-btn-none').onclick=()=>{root.querySelectorAll('.ga-stu-chk').forEach(ch=>{ch.checked=false;});};
  root.querySelectorAll('[data-ga-close]').forEach(b=>{b.onclick=close;});
  root.addEventListener('click',(e)=>{if(e.target===root) close();});
  root.querySelector('#ga-btn-apply').onclick=()=>{
    const ids=take();
    if(!ids.length){alert('Mindestens einen TN auswählen.');return;}
    ids.forEach(sid=>{ const s=c.students.find(x=>x.id===sid); if(s) s.groupId=gid; });
    saveState();
    toast(ids.length===1?'1 TN zugewiesen':ids.length+' TN zugewiesen');
    updateSidebar();
    close();
    renderGruppen();
  };
  root.querySelector('#ga-btn-clear').onclick=()=>{
    const ids=take();
    if(!ids.length){alert('Mindestens einen TN auswählen.');return;}
    ids.forEach(sid=>{ const s=c.students.find(x=>x.id===sid); if(s) s.groupId=''; });
    saveState();
    toast(ids.length===1?'1 TN ohne Gruppe':ids.length+' TN ohne Gruppe');
    updateSidebar();
    close();
    renderGruppen();
  };
}
function addGroup(){
  const c=getActiveClass(); if(!c) return;
  c.groups.push({id:'g'+Date.now(),name:'',text:'',maxPunkte:54});
  saveState(); renderGruppen();
}
function updateGroup(id,field,val){
  const c=getActiveClass(); if(!c) return;
  const g=c.groups.find(x=>x.id===id); if(!g) return;
  if(field==='color'){
    const v=String(val==null?'':val).trim();
    if(!v){ delete g.color; saveState(); renderGruppen(); return; }
    if(/^#[0-9a-fA-F]{6}$/i.test(v)) g.color=v.toLowerCase();
    saveState(); renderGruppen();
    return;
  }
  g[field]=field==='maxPunkte'?parseFloat(val)||0:val;
  saveState();
  if(field==='maxPunkte') renderGruppen();
}
function removeGroup(id){
  const c=getActiveClass(); if(!c) return;
  if(c.students.some(s=>s.groupId===id)){
    alert('Diese Gruppe hat noch TN. Bitte TN zuerst in andere Gruppen verschieben.');return;
  }
  c.groups=c.groups.filter(g=>g.id!==id);
  saveState(); renderGruppen();
}

// ─── APPEARANCE ───────────────────────────────────────────────────────────────
function renderAppearance(){
  const th=appearance.theme==='dark'?'dark':'light';
  const chips=SIDEBAR_COLORS.map(c=>`
    <div class="color-chip ${appearance.sidebarPreset===c.id?'selected':''}"
      style="background:${c[th][0]}"
      title="${esc(c.label)}"
      onclick="setSidebarPreset('${c.id}')"></div>`).join('');
  const fid=appearance.fontId||'lato';
  const fontBtns=APP_FONTS.map((f,i)=>{
    const fam=String(f.family).replace(/"/g,'');
    const num=i+1;
    const t=esc(f.family);
    return`<button type="button" class="font-choice-btn ${fid===f.id?'active':''}" style="font-family:'${fam}',ui-sans-serif,sans-serif" title="${t}" aria-label="${t}" onclick="setFontId('${f.id}')">Font ${num}</button>`;
  }).join('');

  document.getElementById('content').innerHTML=`
    <div class="appearance-page">
    <div class="card">
      <div class="card-header">
        <div>
          <div class="card-title">Erscheinungsbild</div>
        </div>
      </div>
      <div class="card-body">
        <div class="appearance-grid">
          <div>
            <div class="appearance-block-label">Modus</div>
            <div class="theme-toggle" role="group" aria-label="Farbschema">
              <button type="button" class="theme-btn ${appearance.theme==='light'?'active':''}" onclick="setTheme('light')">${svgThemeIcon('sun')}Hell</button>
              <button type="button" class="theme-btn ${appearance.theme==='dark'?'active':''}" onclick="setTheme('dark')">${svgThemeIcon('moon')}Dunkel</button>
            </div>
            <div class="appearance-block-label" style="margin-top:18px">Oberfläche</div>
            <div class="theme-toggle" role="group" aria-label="Oberfläche">
              <button type="button" class="theme-btn ${(appearance.surface||'ansprechend')==='schlicht'?'active':''}" onclick="setSurfaceMode('schlicht')">Schlicht</button>
              <button type="button" class="theme-btn ${(appearance.surface||'ansprechend')==='ansprechend'?'active':''}" onclick="setSurfaceMode('ansprechend')">Schattiert</button>
            </div>
          </div>
          <div>
            <div class="appearance-block-label">Seitenleiste</div>
            <div class="color-chips">${chips}</div>
          </div>
        </div>
        <div class="appearance-font-row">
          <div class="appearance-block-label">Schriftart</div>
          <div class="font-choice-grid">${fontBtns}</div>
        </div>
      </div>
    </div>
    </div>`;
}
function setTheme(t){
  appearance.theme=t; saveAppearance(); renderAppearance();
}
function setSidebarPreset(id){
  if(!SIDEBAR_COLORS.some(c=>c.id===id)) return;
  appearance.sidebarPreset=id; saveAppearance(); renderAppearance();
}
function setSurfaceMode(mode){
  if(mode!=='schlicht'&&mode!=='ansprechend') return;
  appearance.surface=mode; saveAppearance(); renderAppearance();
}
function setFontId(id){
  if(!APP_FONTS.some(f=>f.id===id)) return;
  appearance.fontId=id; saveAppearance(); renderAppearance();
}

// ─── IMPORT / EXPORT ──────────────────────────────────────────────────────────
function renderImportExport(){
  document.getElementById('content').innerHTML=`
    <div class="ie-grid">
      <div class="ie-card">
        <h3>Export</h3>
        <button class="btn btn-primary" onclick="exportJSON()">JSON exportieren</button>
      </div>
      <div class="ie-card">
        <h3>Import</h3>
        <button class="btn btn-ghost" onclick="importJSON()">JSON importieren</button>
      </div>
    </div>
    <div class="ie-card ie-card--danger" style="margin-top:14px;background:var(--card)">
      <h3 style="color:#b91c1c">Zurücksetzen</h3>
      <button class="btn btn-danger" onclick="resetAll()">Alles löschen</button>
    </div>`;
}
function exportJSON(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  const cm=getActiveClass();
  a.download='pruefung-'+(cm&&cm.meta.datum?cm.meta.datum:Date.now())+'.json';
  a.click();
}
function importJSON(){
  const input=document.createElement('input');
  input.type='file';input.accept='.json';
  input.onchange=e=>{
    const f=e.target.files[0];
    const r=new FileReader();
    r.onload=ev=>{
      try{
        selectedStudent=null;
        state=migrateState(JSON.parse(ev.target.result));
        saveState(); nav('home'); toast('Importiert');
      }catch(e){alert('Ungültige JSON-Datei');}
    };
    r.readAsText(f);
  };
  input.click();
}
function resetAll(){
  if(!confirm('Wirklich alle Daten löschen? Dieser Vorgang kann nicht rückgängig gemacht werden.')) return;
  selectedStudent=null;
  state=JSON.parse(JSON.stringify(EMPTY_STATE));
  saveState(); updateSidebar(); nav('home'); toast('Zurückgesetzt');
}

// ─── MODAL ────────────────────────────────────────────────────────────────────
function showModal(title,body,onConfirm,opts){
  opts=opts||{};
  const okLabel=opts.okLabel||'Speichern';
  const wideCls=opts.wide?' modal-wide':'';
  const div=document.createElement('div');
  div.className='modal-backdrop';
  div.innerHTML=`<div class="modal${wideCls}" onclick="event.stopPropagation()">
    <div class="modal-header"><div class="modal-title">${title}</div><button class="modal-close" onclick="closeModal()">&#x2715;</button></div>
    <div class="modal-body">${body}</div>
    <div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal()">Abbrechen</button><button class="btn btn-primary" id="modal-ok">${esc(okLabel)}</button></div>
  </div>`;
  div.onclick=closeModal;
  document.body.appendChild(div);
  document.getElementById('modal-ok').onclick=()=>{if(onConfirm()!==false) closeModal();};
}
function closeModal(){
  const m=document.querySelector('.modal-backdrop:not(.modal-picto-backdrop)');
  if(m) m.remove();
}

// ─── TOAST ────────────────────────────────────────────────────────────────────
function toast(msg){
  const el=document.createElement('div');
  el.className='toast';el.textContent=msg;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(()=>el.remove(),2400);
}

// ─── UTILS ────────────────────────────────────────────────────────────────────
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');}

// ─── INIT ─────────────────────────────────────────────────────────────────────
updateSidebar();
nav('home');
</script>
</body>
</html>
